<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grocery Loyalty</title>
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>
<header>
  <div class="brand">🛒 <span>Grocery<span class="accent">Club</span></span></div>
  <nav>
    <button class="nav active" data-page="home">หน้าสมาชิก</button>
    <button class="nav" data-page="register">สมัครสมาชิก</button>
    <a href="/admin" class="nav">หลังร้าน</a>
  </nav>
</header>

<main>
<section id="home" class="page active">
  <div class="hero">
    <div>
      <span class="pill">LOYALTY PROGRAM</span>
      <h1>ซื้อของทุกวัน<br><span class="accent">คะแนนก็เพิ่มทุกวัน</span></h1>
      <p>สะสมคะแนน แลกของรางวัล และใช้คะแนนร่วมกิจกรรมของร้าน</p>
    </div>
    <div class="hero-card">
      <div class="small">รหัสสมาชิก หรือ เบอร์โทร</div>
      <input id="memberCode" placeholder="เช่น 100001 หรือ 0812345678">
      <button onclick="loadMember()">ดูคะแนนของฉัน</button>
    </div>
  </div>
  <div id="memberView"></div>
</section>

<section id="register" class="page">
  <div class="panel narrow">
    <span class="pill">JOIN FREE</span>
    <h2>สมัครสมาชิก</h2>
    <p>รับคะแนนและสิทธิพิเศษจากร้าน</p>
    <input id="regName" placeholder="ชื่อ-นามสกุล">
    <input id="regPhone" placeholder="เบอร์โทรศัพท์">
    <button onclick="register()">สมัครสมาชิก</button>
    <div id="regResult"></div>
  </div>
</section>


</main>

<script src="/app.js"></script>
</body>
</html>
