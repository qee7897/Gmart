services:
  - type: web
    name: grocery-loyalty
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: grocery-loyalty-db
          property: connectionString
      - key: ADMIN_KEY
        sync: false

databases:
  - name: grocery-loyalty-db
    plan: free
